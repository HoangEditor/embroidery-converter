# fly.toml — Fly.io deployment config
# Docs: https://fly.io/docs/reference/configuration/

app = "embroidery-converter"
primary_region = "sin"  # Singapore — closest to Vietnam

[build]
  dockerfile = "Dockerfile"

[env]
  # No env vars needed for free tier

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256  # Free tier limit

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

# Auto-start on deploy
[processes]
  app = "uvicorn backend.main:app --host 0.0.0.0 --port 8000"
