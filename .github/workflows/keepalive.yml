name: Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping embroidery sites
        run: |
          curl -s -o /dev/null -w "Converter: %{http_code}\n" https://embroidery-file-converter.onrender.com || true
          sleep 3
          curl -s -o /dev/null -w "Floss: %{http_code}\n" https://embroidery-floss-matcher.onrender.com || true
          echo "✅ Keepalive done"
